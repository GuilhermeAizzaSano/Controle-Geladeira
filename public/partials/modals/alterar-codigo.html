  <!-- MODAL ALTERAR CÓDIGO -->
  <div class="modal fade" id="alterarCodigoModal" tabindex="-1" aria-labelledby="alterar-codigo-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:400px;">
      <div class="modal-content">

        <div class="modal-header">
          <span class="modal-title" id="alterar-codigo-title">Alterar código de acesso</span>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div id="alterar-codigo-error" class="alert alert-danger d-none py-2 mb-3"
            style="font-size:.85rem;border-radius:var(--r-md);">
          </div>

          <div class="mb-3">
            <label class="bc-label">Código atual</label>
            <input type="text" id="codigo-atual" class="bc-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
              placeholder="000000" autocomplete="current-password" />
          </div>

          <div class="mb-3">
            <label class="bc-label">Novo código</label>
            <input type="text" id="codigo-novo" class="bc-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
              placeholder="000000" autocomplete="new-password" />
          </div>

          <div>
            <label class="bc-label">Confirmar novo código</label>
            <input type="text" id="codigo-confirmar" class="bc-input" inputmode="numeric" pattern="[0-9]{6}"
              maxlength="6" placeholder="000000" autocomplete="new-password" />
            <div class="field-hint">Use exatamente 6 dígitos numéricos.</div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-cancel-modal" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn-save ms-2" id="btn-save-alterar-codigo">
            <span id="alterar-codigo-btn-text">Salvar</span>
            <span id="alterar-codigo-loader" class="bc-loader d-none"
              style="width:14px;height:14px;border-top-color:#000;"></span>
          </button>
        </div>

      </div>
    </div>
  </div>
