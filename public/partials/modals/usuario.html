  <!-- MODAL USUÁRIO -->
  <div class="modal fade" id="usuarioModal" tabindex="-1" aria-labelledby="usuario-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:420px;">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title" id="usuario-modal-title">Novo usuário</span>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="usuario-id">
          <div class="mb-3">
            <label class="bc-label">Nome completo</label>
            <input type="text" id="usuario-nome" class="bc-input" placeholder="Ex: João Silva" maxlength="100">
          </div>
          <div class="mb-3">
            <label class="bc-label">Código de acesso (6 dígitos)</label>
            <input type="text" id="usuario-codigo" class="bc-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
              placeholder="Ex: 123456" autocomplete="off" />
            <div class="field-hint">Este código será usado para fazer login.</div>
          </div>
          <div>
            <label class="bc-label">Perfil</label>
            <select id="usuario-is-admin" class="bc-input">
              <option value="false">Usuário — acessa a loja</option>
              <option value="true">Administrador — acessa o painel de controle</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel-modal" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn-save ms-2" id="btn-save-usuario">
            <span id="save-usuario-text">Salvar</span>
            <span id="save-usuario-loader" class="bc-loader d-none"
              style="width:14px;height:14px;border-top-color:#000;"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
