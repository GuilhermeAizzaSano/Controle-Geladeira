  <!-- CONFIRM MODAL (shared reusable) -->
  <div class="modal fade" id="confirmModal" tabindex="-1"
       aria-labelledby="confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:360px;">
      <div class="modal-content bc-modal">
        <div class="modal-header">
          <h5 class="modal-title" id="confirm-title">Confirmar</h5>
        </div>
        <div class="modal-body">
          <p id="confirm-message" class="mb-0"></p>
        </div>
        <div class="modal-footer" style="border:none;padding-top:0;">
          <button type="button" class="btn btn-sm btn-cancel-modal"
            data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn ms-2 btn-danger-modal"
            id="btn-confirm-action">Confirmar</button>
        </div>
      </div>
    </div>
  </div>
