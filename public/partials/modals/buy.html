  <!-- MODAL COMPRA -->
  <div class="modal fade" id="buyModal" tabindex="-1" aria-labelledby="buy-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title" id="buy-modal-title">Confirmar compra</span>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-3">
          <div class="modal-eyebrow">Item selecionado</div>
          <div class="confirm-product-name" id="modal-name">—</div>
          <div class="confirm-product-price" id="modal-price">R$ 0,00</div>

          <div class="qty-label" id="buy-qty-label">Quantidade</div>
          <div class="qty-stepper">
            <button type="button" class="qty-btn" id="btn-qty-minus" aria-label="Diminuir quantidade">−</button>
            <input type="text" id="buy-qty" class="bc-input qty-input" inputmode="numeric"
                   value="1" maxlength="2" autocomplete="off" aria-labelledby="buy-qty-label">
            <button type="button" class="qty-btn" id="btn-qty-plus" aria-label="Aumentar quantidade">+</button>
          </div>
          <div class="qty-subtotal" id="buy-subtotal">R$ 0,00</div>

          <div class="confirm-note">Isso será lançado na sua conta.</div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel-modal" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn-confirm ms-2" id="btn-confirm-buy">
            <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-check"/></svg>
            Confirmar
          </button>
        </div>
      </div>
    </div>
  </div>
