  <!-- MODAL ALTERAR SENHA ADMIN -->
  <div class="modal fade" id="alterarSenhaAdminModal" tabindex="-1" aria-labelledby="alterar-senha-admin-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:400px;">
      <div class="modal-content">

        <div class="modal-header">
          <span class="modal-title" id="alterar-senha-admin-title">Alterar senha de administrador</span>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div id="alterar-senha-admin-error" class="alert alert-danger d-none py-2 mb-3"
            style="font-size:.85rem;border-radius:var(--r-md);"></div>

          <div class="mb-3">
            <label class="bc-label">Senha atual</label>
            <input type="password" id="senha-admin-atual" class="bc-input" autocomplete="current-password" />
          </div>

          <div class="mb-3">
            <label class="bc-label">Nova senha</label>
            <input type="password" id="senha-admin-nova" class="bc-input" autocomplete="new-password" />
          </div>

          <div>
            <label class="bc-label">Confirmar nova senha</label>
            <input type="password" id="senha-admin-confirmar" class="bc-input" autocomplete="new-password" />
            <div class="field-hint">Mínimo 6 caracteres. Letras, números e símbolos.</div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-cancel-modal" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn-save ms-2" id="btn-save-alterar-senha-admin">
            <span id="alterar-senha-admin-btn-text">Salvar</span>
            <span id="alterar-senha-admin-loader" class="bc-loader d-none"
              style="width:14px;height:14px;border-top-color:#000;"></span>
          </button>
        </div>

      </div>
    </div>
  </div>
