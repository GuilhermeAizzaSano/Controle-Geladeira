  <!-- ADMIN — PRODUTOS -->
  <div id="screen-produtos" class="screen container-fluid py-3 px-3" style="max-width:1100px;">
    <div class="screen-header screen-header--admin">
      <span class="admin-badge">Produtos</span>
      <div>
        <div class="screen-header-title">Gerenciar produtos</div>
        <div class="screen-header-sub">Adicione, edite ou desative produtos do cardápio</div>
      </div>
      <div class="screen-header-actions">
        <button class="btn-new" id="btn-new-produto">
          <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-plus"/></svg>
          Novo produto
        </button>
      </div>
    </div>

    <div class="admin-search-wrap">
      <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="text" id="produtos-search" class="bc-input" placeholder="Pesquisar produto por nome..."
        autocomplete="off" />
    </div>

    <div class="admin-table-wrap">
      <table class="table admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="produtos-body">
          <tr>
            <td colspan="5">
              <div class="empty-state">
                <div class="bc-loader mx-auto"></div>
                <div class="mt-2">Carregando...</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
