  <!-- SHOP -->
  <div id="screen-shop" class="screen container-fluid py-3 px-3" style="max-width:1100px;">
    <div class="screen-header">
      <div class="screen-header-metric">
        <span class="label">Meu total</span>
        <span class="value" id="my-total">R$ 0,00</span>
      </div>
      <div class="screen-header-actions">
        <div class="refresh-wrap">
          <span class="refresh-updated-at" id="shop-updated-at"></span>
          <button class="btn-refresh" id="btn-refresh-shop">
            <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-refresh"/></svg>
            Atualizar
          </button>
        </div>
      </div>
    </div>

    <div class="shop-search-wrap">
      <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="text" id="shop-search" class="bc-input" placeholder="Pesquisar bebida por nome..."
        autocomplete="off" />
    </div>

    <div id="shop-fav-section" class="d-none">
      <div class="section-label section-label--fav">
        <svg class="ic" width="13" height="13" aria-hidden="true"><use href="#i-star"/></svg>
        Favoritos
      </div>
      <div id="product-grid-fav" class="product-grid mb-5"></div>
    </div>

    <div class="section-label">Produtos disponíveis</div>
    <div id="product-grid" class="product-grid">
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="bc-loader mx-auto"></div>
        <div class="mt-2">Carregando...</div>
      </div>
    </div>

    <div class="section-label">Meus últimos itens</div>
    <div class="history-table-wrap">
      <table class="table table-hover history-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Produto</th>
            <th>Valor</th>
            <th>Data/hora</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr>
            <td colspan="4">
              <div class="empty-state">
                <div class="empty-icon"><svg class="ic" width="28" height="28" aria-hidden="true"><use href="#i-receipt"/></svg></div>
                <div>Nenhuma compra ainda</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div id="history-pagination" class="bc-pagination d-none"></div>
    </div>
  </div>
